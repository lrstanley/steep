# read by lrstanley/.github's goreleaser/run.sh (see .github/workflows/release.yml), which merges this into its
# shared goreleaser config.
goreleaser:
  pre:
    before:
      hooks:
        # go.work is gitignored, and snapshot builds of master may need reel changes that aren't published yet. on a
        # release commit, every module already pins the released reel, so this changes nothing there.
        - go work init ./reel ./cmd/reel
    git:
      # the module tags point at the same commits as the v* tag, which is the one that names the release.
      ignore_tags: ["reel/*", "cmd/*"]
  # one entry per binary. run.sh fills in the flags, ldflags, and env each one leaves out.
  builds:
    - id: reel
      dir: cmd/reel
      main: .
      binary: reel
      targets:
        - linux_amd64
        - linux_arm64
        - darwin_amd64
        - darwin_arm64
        - windows_amd64
        - windows_arm64
  post:
    # "task release" creates the GitHub release with modrelease's --github-release, which writes the notes, before the
    # release workflow starts. so GoReleaser only uploads to it, leaving its notes alone. run.sh sets mode: replace
    # before merging this, and post overrides it. if the release doesn't exist yet, GoReleaser creates one with only
    # the shared header and footer.
    release:
      mode: keep-existing
    changelog:
      disable: true
    # a cask in lrstanley/homebrew-tap, built from the raw binaries rather than archives. lang-go-release.yml mints
    # HOMEBREW_TAP_TOKEN from the bot app on tag runs when homebrew-tap is set in release.yml.
    homebrew_casks:
      - name: reel
        ids: [binary]
        description: Make terminal recordings from VHS tapes, and render them as GIFs, videos, and stills
        homepage: https://getsteep.dev/cli
        # every tag updates the tap, prereleases included, as no release is stable yet. skip_upload: auto would skip
        # them.
        # snapshot builds disable the release, and GoReleaser can't derive the download URL without it.
        url:
          template: "https://github.com/lrstanley/steep/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
        repository:
          owner: lrstanley
          name: homebrew-tap
          # token fields only accept a bare {{ .Env.NAME }}.
          token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
        commit_author:
          use_github_app_token: true
        commit_msg_template: "feat(reel): update to {{ .Tag }}"
        hooks:
          post:
            # the macOS binaries aren't signed, and Gatekeeper refuses quarantined unsigned binaries.
            install_steps: |
              on_macos do
                run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}"]
              end
