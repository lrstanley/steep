name: inspector

# typechecks, tests, and builds the inspector, and deploys it to Cloudflare from master, see
# inspector/wrangler.jsonc.
#
# the site is built from most of the repo (reel, steep, the examples), so this ignores only what it
# can't use. this has no go.work, as it doesn't need one: the examples point at this checkout themselves.

on:
  pull_request:
    branches: [master]
    paths-ignore: ["docs/**", "cmd/**", ".gitignore", "**/*.md", ".github/ISSUE_TEMPLATE/**"]
    types: [opened, edited, reopened, synchronize, unlocked]
  push:
    branches: [master]
    paths-ignore: ["docs/**", "cmd/**", ".gitignore", "**/*.md", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch: {}

concurrency:
  group: inspector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: lrstanley/.github/composite/go-versions@master
        id: go-version
        with:
          version: latest
      - uses: lrstanley/.github/composite/install-go@master
        with:
          version: ${{ steps.go-version.outputs.version }}
      - uses: lrstanley/.github/composite/install-node@master
      # the task's plain install would accept a stale bun.lock.
      - working-directory: inspector
        run: bun install --frozen-lockfile
      - uses: lrstanley/.github/composite/invoke-task@master
        with:
          task: inspector:typecheck
      - uses: lrstanley/.github/composite/invoke-task@master
        with:
          task: inspector:test
      - uses: lrstanley/.github/composite/invoke-task@master
        with:
          task: inspector:build
      - if: github.ref == 'refs/heads/master'
        working-directory: inspector
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 deploy
