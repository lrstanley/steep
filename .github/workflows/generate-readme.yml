name: generate-readme

on:
  push:
    branches: [master]
    tags: [v*]
  schedule:
    - cron: "0 13 * * *"
  # a release pushes more than three tags, which GitHub creates no tag events for, so modrelease starts this on the
  # v* tag instead.
  workflow_dispatch: {}

jobs:
  generate:
    uses: lrstanley/.github/.github/workflows/generate-readme.yml@master
    secrets: inherit
