# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  # In dependency order. steep and cmd/reel both require reel.
  MODULES: [reel, ".", cmd/reel, _examples]
  WASM2GO: github.com/ncruces/wasm2go@v0.4.19
  MODRELEASE: github.com/lrstanley/x/cmd/modrelease@latest
  VT_IMAGE: term-vt-zig:0.16.0
  VT_WASM: internal/wasmvt/ghostty-vt.wasm
  VT_HEADER: sed -i '1s/.*/\/\/ Code generated by wasm2go. DO NOT EDIT./' internal/wasmvt/vt.generated.go

set: [errexit, nounset, pipefail]

tasks:
  default:
    desc: format and test all modules
    cmds:
      - task: fmt
      - task: test
  setup:
    desc: create or update go.work, so each module builds against the others in this checkout
    cmds:
      - test -f go.work || go work init
      - go work use {{.MODULES | join " "}}

  # go tasks, run across every module.
  license:
    desc: add license headers
    cmds:
      - curl -sL https://liam.sh/-/gh/g/license-header.sh | bash -s
  fmt:
    desc: run formatters
    cmds:
      - for: { var: MODULES, as: MODULE }
        cmd: cd {{.MODULE}} && golangci-lint fmt
  lint:
    desc: run linters, applying fixes (not on _examples, whose replace directives are intentional)
    cmds:
      - for: [reel, ".", cmd/reel]
        cmd: cd {{.ITEM}} && go fix ./... && golangci-lint run --fix
  tidy:
    desc: run go mod tidy (steep and cmd/reel need the reel version they require to be published)
    cmds:
      - for: { var: MODULES, as: MODULE }
        cmd: cd {{.MODULE}} && go mod tidy
  up:
    desc: upgrade all go and bun dependencies
    cmds:
      - for: { var: MODULES, as: MODULE }
        cmd: cd {{.MODULE}} && go get -u -t ./... && go mod tidy
      - cd docs && bunx npm-check-updates -u && bun install
      - cd inspector && bunx npm-check-updates -u && bun install
  test:
    desc: run tests
    cmds:
      - for: { var: MODULES, as: MODULE }
        cmd: cd {{.MODULE}} && go test -timeout 5m {{default "./..." .CLI_ARGS}}
  test:extended:
    desc: run tests with the race detector, several times over
    env:
      GORACE: exitcode=1 halt_on_error=1
    cmds:
      - for: { var: MODULES, as: MODULE }
        cmd: cd {{.MODULE}} && go test -race -timeout 10m -count 3 -cpu 1,4 {{default "./..." .CLI_ARGS}}
  demos:
    desc: record the examples (needs ffmpeg)
    dir: _examples
    env:
      STEEP_EXPORT_MODE: "on"
    cmds:
      - go test -count 1 ./...
  # run with --github-release and --highlights, as GoReleaser leaves the release notes to modrelease (see
  # .github/ci-config.yml). first run the plan, and read the changelog it prints. then write the highlights file,
  # outside the repo so it isn't committed:
  #   - a short summary of the notable changes. modrelease adds the changelog itself, so don't repeat it.
  #   - how to install the reel CLI, as modrelease only lists go get/go install:
  #       brew install lrstanley/tap/reel  (macOS and Linux, through Homebrew)
  #       prebuilt binaries for Linux, macOS, and Windows, on amd64 and arm64, are attached to the release.
  # both the plan and --apply need a GH_TOKEN that can create releases. for example:
  #   GH_TOKEN=$(gh auth token) task release -- minor --alpha --github-release --highlights /tmp/highlights.md
  #   GH_TOKEN=$(gh auth token) task release -- minor --alpha --github-release --highlights /tmp/highlights.md --apply
  release:
    desc: release all modules at one version, printing the plan unless given --apply (task release -- <version> [--apply])
    preconditions:
      - sh: test -n {{shellQuote .CLI_ARGS}}
        msg: "usage: task release -- <major|minor|patch|version> [--alpha|--beta|--rc] [--apply]"
    cmds:
      - go run {{.MODRELEASE}} {{.CLI_ARGS}}

  # libghostty-vt, which reel/vt embeds.
  vt:image:
    desc: build the zig image that writes ghostty-vt.wasm to stdout
    dir: reel/vt
    cmds:
      - docker build -t {{.VT_IMAGE}} -f build/Dockerfile build
  vt:generate:
    desc: rebuild the libghostty-vt wasm module and abi constants
    dir: reel/vt
    deps: [vt:image]
    cmds:
      - >-
        bash -o pipefail -c 'docker run --rm {{.VT_IMAGE}} | (cd internal/wasmvt && go run {{.WASM2GO}} -unsafe -nanbox -pkg wasmvt -o vt.generated.go)'
      - "{{.VT_HEADER}}"
      - GOWORK=off go run ./cmd/genabi
  vt:wasm2go:
    desc: translate a local ghostty-vt.wasm and regenerate abi constants
    dir: reel/vt
    preconditions:
      - sh: test -f {{.VT_WASM}}
        msg: "missing reel/vt/{{.VT_WASM}}"
    cmds:
      - cd internal/wasmvt && go run {{.WASM2GO}} -unsafe -nanbox -pkg wasmvt -o vt.generated.go ghostty-vt.wasm
      - "{{.VT_HEADER}}"
      - GOWORK=off go run ./cmd/genabi

  # the inspector.
  inspector:install:
    desc: install the inspector's dependencies
    dir: inspector
    cmds:
      - bun install
  inspector:dev:
    desc: run the inspector's dev server
    dir: inspector
    deps: [inspector:install]
    cmds:
      - bun run dev
  inspector:build:
    desc: build the inspector
    dir: inspector
    deps: [inspector:install]
    cmds:
      - bun run build
  inspector:test:
    desc: test the inspector
    dir: inspector
    deps: [inspector:install]
    cmds:
      - bun run test
  inspector:typecheck:
    desc: typecheck the inspector
    dir: inspector
    deps: [inspector:install]
    cmds:
      - bun run typecheck

  # the documentation site.
  docs:install:
    desc: install the docs' dependencies
    dir: docs
    cmds:
      - bun install
  docs:dev:
    desc: run the docs' dev server
    dir: docs
    deps: [docs:install, docs:demos]
    cmds:
      - bun run dev
  docs:build:
    desc: build the docs
    dir: docs
    deps: [docs:install, docs:demos]
    cmds:
      - bun run build
  docs:demos:
    desc: record what the docs show, with the examples and the reel CLI, which needs ffmpeg (--force to re-record)
    deps: [setup]
    # written last, so its absence means the files aren't complete.
    status:
      - test -f docs/fixtures/demo-sizes.json
    cmds:
      - rm -f docs/fixtures/demo-sizes.json
      - rm -rf docs/public/demos docs/public/casts
      - mkdir -p docs/public/demos docs/public/casts
      - cd _examples && STEEP_EXPORT_MODE=on go test -count 1 ./docs-demos/
      - cd _examples && STEEP_EXPORT_MODE=on STEEP_EXPORT=showcase.webp STEEP_EXPORT_DIR="$PWD/../docs/public/demos" STEEP_RENDERER_SCALE=2 go test -count 1 -run '^TestShowcase$' ./steep-showcase/
      - bash docs/scripts/cli-demos.sh
      - bun docs/scripts/demo-sizes.ts
  docs:preview:
    desc: preview the built docs
    dir: docs
    deps: [docs:build]
    cmds:
      - bun run preview
